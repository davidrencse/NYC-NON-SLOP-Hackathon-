[project]
name = "forge-research"
version = "0.1.0"
description = "Evidence-backed component research for FORGE"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.12.0",
    "fastapi>=0.165,<1",
    "google-adk==2.15.0",
    "google-genai>=2.34,<3",
    "pydantic>=2.14,<3",
    "uvicorn>=0.54,<1",
]

[tool.ruff]
target-version = "py312"
line-length = 95
